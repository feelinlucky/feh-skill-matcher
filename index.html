<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FEH Skill Synergy Matcher</title>
  <!-- Tom Select CSS -->
  <link href="https://cdn.jsdelivr.net/npm/tom-select@2.2.2/dist/css/tom-select.bootstrap5.min.css" rel="stylesheet">
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 2rem; background: #1a1b1e; color: #e0e0e0; }
    .container { max-width: 800px; margin: auto; }
    .filter-group { margin-bottom: 1.5rem; }
    label { font-weight: bold; display: block; margin-bottom: 0.5rem; color: #a5d6a7; }
    .card { background: #2b2c30; border-radius: 8px; padding: 1rem; margin-top: 1rem; border-left: 4px solid #81c784; }
    .synergy-badge { background: #388e3c; color: white; padding: 0.2rem 0.5rem; border-radius: 4px; font-size: 0.8rem; margin-right: 0.3rem; }
  </style>
</head>
<body>
  <div class="container">
    <h1>FEH Skill Synergy Matcher</h1>
    
    <div class="filter-group">
      <label for="primary-skill">1. Select Target Skill:</label>
      <select id="primary-skill" placeholder="Search for a skill (e.g., Bonus Doubler 4)..."></select>
    </div>

    <div class="filter-group">
      <label for="target-slot">2. Filter Complementary Slot:</label>
      <select id="target-slot">
        <option value="ALL">All Slots</option>
        <option value="A">A Slot</option>
        <option value="B">B Slot</option>
        <option value="C">C Slot</option>
        <option value="Special">Special</option>
        <option value="Sacred Seal">Sacred Seal</option>
        <option value="X">X (Attuned) Slot</option>
      </select>
    </div>

    <div id="results">
      <h3>Matching Complementary Skills</h3>
      <div id="results-list">Select a skill above to see synergistic combinations.</div>
    </div>
  </div>

  <!-- Tom Select JS -->
  <script src="https://cdn.jsdelivr.net/npm/tom-select@2.2.2/dist/js/tom-select.complete.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
